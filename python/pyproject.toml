[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-scaffold-parser"
version = "0.4.18"
description = "Zero-dependency Python reference parser for Open Scaffold plans and scaffold state."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Graphanov" }]
keywords = ["open-scaffold", "ai-agents", "repo-native", "plans", "parser"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/graphanov/open-scaffold"
Repository = "https://github.com/graphanov/open-scaffold"
Issues = "https://github.com/graphanov/open-scaffold/issues"

[project.scripts]
open-scaffold-parser = "open_scaffold.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["open_scaffold"]
