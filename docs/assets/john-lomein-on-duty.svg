    <text x="132" y="72" fill="#c8b184" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">OPEN SCAFFOLD</text>
    <circle cx="1264" cy="65" r="6" fill="#60e4e7"/>
