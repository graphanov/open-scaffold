      <stop offset="0" stop-color="#101f33"/>
      <stop offset="1" stop-color="#060e19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5c88e"/>
      <stop offset="1" stop-color="#97794c"/>
    </linearGradient>
    <pattern id="pinstripe" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 0V28" stroke="#b8c8db" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1600" height="480" rx="24"/>
    </clipPath>
  </defs>
