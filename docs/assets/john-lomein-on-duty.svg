<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">John Lomein is on duty — 8–14 October 2026</title>
  <desc id="description">A midnight navy banner with restrained gold tailoring lines and a cyan status light announces John Lomein's time-limited autonomous AI maintenance of Open Scaffold using Codex.</desc>
  <defs>
