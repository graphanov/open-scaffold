name: Plan validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".osc/plans/active/*.md"
      - ".osc/plans/active/**/*.md"
      - ".osc/plans/backlog/*.md"
      - ".osc/plans/backlog/**/*.md"
      - ".osc/plans/blocked/*.md"
      - ".osc/plans/blocked/**/*.md"
      - ".osc/plans/done/*.md"
      - ".osc/plans/done/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plans:
    name: Validate changed plans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with public fallback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          server_url="${server_url%/}"
          git remote add origin "${server_url}/${GITHUB_REPOSITORY}.git"
          fetch_refs() {
            local mode="$1"
            shift
            if [[ "$mode" == "auth" && -n "${GITHUB_TOKEN:-}" ]]; then
              local auth_header
              auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch "$@"
            else
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch "$@"
            fi
          }
          fetch_with_fallback() {
            local description="$1"
            shift
            if ! fetch_refs auth "$@"; then
              echo "Authenticated ${description} fetch failed; falling back to public unauthenticated fetch."
              fetch_refs public "$@"
            fi
          }
          fetch_with_fallback repository --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            fetch_with_fallback pull-request-merge --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
            git checkout --force "refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
          else
            git checkout --force "$GITHUB_SHA"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Find changed plan files
        id: changed-plans
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref || 'main' }}"
          git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- \
            '.osc/plans/active/*.md' \
            '.osc/plans/active/**/*.md' \
            '.osc/plans/backlog/*.md' \
            '.osc/plans/backlog/**/*.md' \
            '.osc/plans/blocked/*.md' \
            '.osc/plans/blocked/**/*.md' \
            '.osc/plans/done/*.md' \
            '.osc/plans/done/**/*.md' | sort | while IFS= read -r plan; do
              case "$plan" in
                *-amendment-[0-9]*.md) continue ;;
                *) printf '%s\n' "$plan" ;;
              esac
            done > changed-plans.txt
          count="$(wc -l < changed-plans.txt | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" == "0" ]]; then
            echo "No changed plan files to validate."
          else
            echo "Changed plan files:"
            cat changed-plans.txt
          fi

      - name: Validate changed plans
        if: steps.changed-plans.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r plan; do
            [[ -n "$plan" ]] || continue
            echo "::group::osc plan validate $plan"
            node dist/cli.js plan validate "$plan"
            echo "::endgroup::"
          done < changed-plans.txt
