name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: "Version in package.json that should be published"
        required: true
        type: string
      npm-tag:
        description: "npm dist-tag to publish"
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without workflow token
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
            git checkout --force "refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
          else
            git checkout --force "$GITHUB_SHA"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: Verify scaffold
        run: ./verify.sh --strict

      - name: Validate requested version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "${{ inputs.expected-version }}" ]]; then
            echo "package.json version $version does not match expected version ${{ inputs.expected-version }}" >&2
            exit 1
          fi
          if npm view "open-scaffold@$version" version >/dev/null 2>&1; then
            echo "open-scaffold@$version is already published" >&2
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        run: npm publish --tag "${{ inputs.npm-tag }}" --provenance
