name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: "Version in package.json that should be published"
        required: true
        type: string
      npm-tag:
        description: "npm dist-tag to publish"
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with public fallback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          server_url="${server_url%/}"
          git remote add origin "${server_url}/${GITHUB_REPOSITORY}.git"
          fetch_refs() {
            local mode="$1"
            shift
            if [[ "$mode" == "auth" && -n "${GITHUB_TOKEN:-}" ]]; then
              local auth_header
              auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch "$@"
            else
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch "$@"
            fi
          }
          fetch_with_fallback() {
            local description="$1"
            shift
            if ! fetch_refs auth "$@"; then
              echo "Authenticated ${description} fetch failed; falling back to public unauthenticated fetch."
              fetch_refs public "$@"
            fi
          }
          fetch_with_fallback repository --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            fetch_with_fallback pull-request-merge --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
            git checkout --force "refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
          else
            git checkout --force "$GITHUB_SHA"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: Verify scaffold
        run: ./verify.sh --strict

      - name: Validate requested version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "${{ inputs.expected-version }}" ]]; then
            echo "package.json version $version does not match expected version ${{ inputs.expected-version }}" >&2
            exit 1
          fi
          if npm view "open-scaffold@$version" version >/dev/null 2>&1; then
            echo "open-scaffold@$version is already published" >&2
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        run: npm publish --tag "${{ inputs.npm-tag }}" --provenance
