ructured questions and produces a filled plan file in `.osc/plans/active/\u003cslug\u003e.md` with real content in every section — no `TODO:` markers remain.","criteria":[{"done":false,"text":"`osc plan wizard my-feature` asks 5–8 questions interactively (goal description, context/trigger, constraints, files to touch, acceptance criteria with multi-line input, verification method, open questions/dependencies)."},{"done":false,"text":"Produces a plan file at `.osc/plans/active/my-feature.md` with all 7 sections filled with user-provided content."},{"done":false,"text":"No `TODO:` markers remain in the generated plan."},{"done":false,"text":"User can skip any question by entering an empty line (section is left blank or marked \"not specified\")."},{"done":false,"text":"`--non-interactive --answers answers.json` reads from file and produces identical output to what interactive input would generate for the same answers."},{"done":false,"text":"Generated plan passes `./verify.sh --strict` schema checks (correct headings, required sections present)."},{"done":false,"text":"Wizard refuses to continue if `MISSION.md` is unset (contains `\u003c!-- mission:unset --\u003e`), printing a clear message."},{"done":false,"text":"`--stage` flag allows targeting `backlog/`, `blocked/`, or `active/` (default `active/`)."}],"openQuestions":["Should the wizard support an `--editor` mode that opens `$EDITOR` with the pre-filled template instead of inline Q\u0026A? This could serve users who prefer writing in their editor but want the template pre-populated with prompts.","Should answers be cached so the wizard can resume an interrupted session? The `readline` approach loses state on Ctrl+C — a `.osc/.wizard-cache.json` temp file could enable resume with `osc plan wizard --resume`.","Should the wizard auto-detect the stage folder based on answers (e.g., if user mentions \"blocked on X\" in open questions, suggest `--stage blocked`)? That's heuristic and fragile; explicit `--stage` is clearer.","How many AC prompts should the wizard offer before timing out? The current design loops until empty line; a max of 10 AC items with a \"continue? (y/n)\" prompt after 5 could prevent accidental infinite loops."]},{"slug":"053-plan-template-library","path":".osc/plans/done/053-plan-template-library.md","stage":"done","status":"done","goal":"Ship 6 domain-specific plan templates under `.osc/plans/templates/` that users can copy manually or reference with `osc plan new \u003cslug\u003e --from-template \u003cname\u003e`, each with all 7 sections filled with realistic example content and clearly marked replaceable parts.","criteria":[{"done":false,"text":"At least 6 templates exist under `.osc/plans/templates/` (bug-fix, new-feature, refactor, docs-update, dependency-upgrade, arch-decision)."},{"done":false,"text":"Each template has all 7 required sections (Status, Context, Goal, Constraints/Out of scope, Files to touch, Acceptance criteria, Verification steps) plus Open questions."},{"done":false,"text":"Each template has realistic example content — a bug-fix template might mention \"NullPointerException in UserService.createUser()\" and \" reproduce with empty email field\" rather than generic placeholder text."},{"done":false,"text":"`osc plan new my-bug --from-template bug-fix --stage backlog` copies the bug-fix template to `.osc/plans/backlog/my-bug.md`, replacing `REPLACE_ME:` markers with blank prompts."},{"done":false,"text":"`osc plan new my-thing --from-template list` prints available template names."},{"done":false,"text":"`.osc/plans/templates/README.md` explains usage, extension, and naming conventions."},{"done":false,"text":"All templates pass `./verify.sh --strict` schema checks (headings match, sections present)."},{"done":false,"text":"No `TODO:` markers in any template; all placeholder content uses `REPLACE_ME:` prefix."}],"openQuestions":["Should templates be versioned (e.g., `bug-fix-v1.md`) to allow template evolution without breaking existing plans that reference old template names? Simple approach: version the directory (`templates/v1/`) and symlink or alias the latest.","Should the template system support includes or inheritance (e.g., a \"performance\" template that extends \"refactor\")? That adds complexity; flat templates with clear naming are sufficient for v1.","Should the npm package ship only the 6 core templates, or also include the `custom-` namespace for user templates? Only core templates ship; user templates live in the scaffold directory and are gitignored from npm pack.","Should `osc plan new --from-template` validate that the template is a valid plan before copying? Yes — validate template structure at copy time and reject malformed templates with a clear error."]},{"slug":"054-multi-language-agent-entry-points-amendment-1","path":".osc/plans/done/054-multi-language-agent-entry-points-amendment-1.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"054-multi-language-agent-entry-points","path":".osc/plans/done/054-multi-language-agent-entry-points.md","stage":"done","status":"active","goal":"Ship AGENTS.md and CLAUDE.md translations in 5 languages (Chinese/zh, Japanese/ja, Korean/ko, Spanish/es, Portuguese/pt) plus a contributor translation guide, with structural parity to the English originals verified by heading-count diff.","criteria":[{"done":false,"text":"10 translated files exist (5 language pairs: zh, ja, ko, es, pt), each with the canonical-source header."},{"done":false,"text":"Each translated file has identical heading structure to its English source, verified by `diff \u003c(grep '^##' AGENTS.md | sort) \u003c(grep '^##' AGENTS-\u003clang\u003e.md | sort)` returning no output (empty diff)."},{"done":false,"text":"`docs/TRANSLATIONS.md` exists with contribution guide: file naming convention (`AGENTS-\u003cISO 639-1\u003e.md`), heading parity check command, machine translation tool recommendation (DeepL or Google Translate), human review checklist, and maintenance policy."},{"done":false,"text":"`./verify.sh --strict` passes — translated files are additive and do not modify originals."},{"done":false,"text":"Each translated file has a header block: `\u003c!-- TRANSLATION: This is a machine-assisted \u003clanguage\u003e translation. The canonical source is the English AGENTS.md. Report discrepancies at \u003crepo\u003e/issues. Last synced: \u003cdate\u003e. --\u003e`"},{"done":false,"text":"`README.md` mentions available translations, either in a \"Languages\" section or as badges."},{"done":false,"text":"No `TODO:` markers or untranslated English sections in any translated file."}],"openQuestions":["Should translated files live at repo root (alongside AGENTS.md) or in a `i18n/` or `translations/` subdirectory? Root keeps them visible to agent tools that scan the root for entry-point files; a subdirectory hides them from automatic detection.","What is the maintenance contract when English AGENTS.md changes? Option A: a CI check that fails if translated files have diverged heading structure, flagging them for manual update. Option B: an automated translation update workflow using a translation API. Option A is simpler and more trustworthy for v1.","Should we include French, German, Russian, or Arabic? The 5 languages were chosen for coverage of large developer populations (China, Japan, Korea, Latin America, Brazil). Additional languages can follow the contributor guide.","Should `AGENTS-\u003clang\u003e.md` files include a `lang` attribute in their frontmatter or header for machine detection? The ISO 639-1 code in the filename is sufficient for now; YAML frontmatter would add parsing complexity without clear benefit."]},{"slug":"055-plan-linter","path":".osc/plans/done/055-plan-linter.md","stage":"done","status":"done","goal":"Add `osc plan validate \u003cslug-or-path\u003e` that performs mechanical and heuristic checks on a plan file, reports actionable issues with severity (error/warning/note), line number, and fix suggestion, and supports machine-parseable JSON output for CI integration.","criteria":[{"done":false,"text":"`osc plan validate my-feature` checks: all 7 required sections present, no `TODO:` markers, acceptance criteria section not empty, goal section not consisting solely of vague words (\"improve\", \"fix\", \"update\" without specifics), open questions about blockers use `BLOCKING:` prefix, plan status matches stage folder."},{"done":false,"text":"Output includes severity level (`error`, `warning`, `note`), line number, and a fix suggestion for each issue."},{"done":false,"text":"`--json` outputs a JSON array of issue objects: `[{severity, line, rule, message, suggestion}]`."},{"done":false,"text":"Exit code is 0 for clean, 1 for any error-level issues, 0 for warnings-only when `--strict` is NOT set. With `--strict`, exit code 1 for any warning or error."},{"done":false,"text":"Works for plans in `active/`, `backlog/`, `blocked/`, and `done/` — resolves the slug to the appropriate stage folder."},{"done":false,"text":"Detects plan status/folder mismatch: if `## Status` says `active` but the file is in `backlog/`, reports an error."},{"done":false,"text":"`osc plan validate nonexistent-plan` prints clear error and exits non-zero."}],"openQuestions":["Should the linter also check that `MISSION.md` is defined before validating a plan? The verify.sh chain already enforces this; duplicating it in the linter adds coupling. Keep it in verify.sh for now.","What heuristic threshold qualifies a goal as \"vague\"? Current plan: flag goals that are fewer than 5 words OR consist entirely of stopwords and generic verbs (\"improve\", \"fix\", \"update\", \"change\", \"make better\", \"refactor\"). This will have false positives for genuinely concise goals — the severity should be `warning` not `error`.","Should the linter check for MISSION.md alignment (e.g., plan goal contradicts a MISSION.md non-goal)? That crosses into semantic analysis and is out of scope for a mechanical linter.","Should `osc plan validate` be run automatically as a git pre-commit hook? A `.husky/pre-commit` hook that runs `osc plan validate` on staged plan files would be ideal but requires opt-in setup (Husky dependency). Document the hook in `docs/WORKFLOW.md` and leave it as a user opt-in."]},{"slug":"056-run-dry-run-preview","path":".osc/plans/done/056-run-dry-run-preview.md","stage":"done","status":"done — implemented in this slice. `osc run \u003cplan\u003e --dry-run` now previews run packets without writing `.osc/runs/` artifacts.","goal":"Add `osc run \u003cplan\u003e --dry-run` that validates the plan, generates the complete `run.json` and `package.md` in memory, prints them to stdout with a human-readable summary, and exits without creating any files in `.osc/runs/`.","criteria":[{"done":false,"text":"`osc run .osc/plans/active/my-feature.md --dry-run` prints the complete `run.json` that would be generated to stdout, followed by a human-readable summary."},{"done":false,"text":"The summary includes: \"Would create run \u003crun_id\u003e in .osc/runs/... with executor \u003cexecutor\u003e, workflow \u003cworkflow\u003e, harness skill \u003cskill\u003e\"."},{"done":false,"text":"The summary lists files that would be touched, extracted from the plan's `## Files to touch` section."},{"done":false,"text":"Does NOT create any files or directories under `.osc/runs/` — verified by `ls .osc/runs/` before and after."},{"done":false,"text":"Reports blockers if `packageQuality.executable` would be `false` (missing acceptance criteria, blocking open questions, undefined mission)."},{"done":false,"text":"Exit code 1 if the plan is not executable; exit code 0 if the dry run would succeed."},{"done":false,"text":"`--json` flag outputs only the JSON (no summary), suitable for piping to `jq` or other tools."},{"done":false,"text":"Works with `--runtime \u003cname\u003e` and `--workflow \u003cname\u003e` overrides, reflected in the generated `run.json`."}],"openQuestions":["Should the dry-run output include an estimated token count or cost estimate for the executor? That would require model-specific pricing data and is out of scope, but a character count of the generated `package.md` would be a cheap proxy.","Should `osc run --dry-run` be the default behavior, requiring `--execute` or `--write` to actually create the run? Changing defaults would break existing workflows; keep `--dry-run` as an opt-in flag and document it as the recommended first step.","Should the dry-run also validate that the executor/harness skill is available? Currently the run packet just names the executor; validation would require checking that the named harness is installed, which crosses into environment dependency checking.","Should `--dry-run` be available on `osc amend` and `osc close` as well? Those commands are simpler and less destructive, but dry-run consistency across all lifecycle commands is desirable. Defer to future plans."]},{"slug":"057-automated-evidence-collection-amendment-1","path":".osc/plans/done/057-automated-evidence-collection-amendment-1.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"057-automated-evidence-collection","path":".osc/plans/done/057-automated-evidence-collection.md","stage":"done","status":"done","goal":"Add `osc evidence collect \u003cslug\u003e` that automatically gathers verification output (`./verify.sh`), git context (branch, recent commits, changed files), PR and CI status (via `gh` CLI when available), and populates the evidence note skeleton with collected data, preserving any existing content.","criteria":[{"done":false,"text":"`osc evidence collect my-feature` runs `./verify.sh --standard` and captures its stdout and exit code in the evidence note."},{"done":false,"text":"Detects current git branch (via `git branch --show-current`) and includes it in the evidence note."},{"done":false,"text":"Lists changed files from `git diff --name-status HEAD~1..HEAD` (or `git diff --cached` if no commits) and includes them."},{"done":false,"text":"Checks for open PRs via `gh pr list --head \u003cbranch\u003e` when available; captures PR number, title, and URL if found."},{"done":false,"text":"Checks CI status via `gh pr checks` when `--ci` flag is set; captures check names and conclusions (success/failure/pending)."},{"done":false,"text":"Populates the evidence note skeleton with collected data as a new timestamped block (e.g., `### Collected 2026-05-18T14:30:00Z`), preserving any existing content above it."},{"done":false,"text":"Reports what it could NOT collect (e.g., \"gh CLI not available — PR and CI checks skipped\", \"no git repository detected — git context skipped\") in the evidence note."},{"done":false,"text":"`--dry-run` prints what would be collected to stdout without writing the evidence file."},{"done":false,"text":"Works without `gh` CLI installed (skips PR/CI data gracefully, includes note about missing tool)."},{"done":false,"text":"Works in a non-git directory (skips git context gracefully)."}],"openQuestions":["Should `osc evidence collect` also capture environment context (OS, Node version, shell) for reproducibility? Including `uname -a` and `node --version` output would help debug environment-specific issues but could leak private machine details. Make it opt-in with `--env` flag.","Should collected evidence include a diff of the changed files, or just the file list? Full diffs could be large and clutter the evidence note. File list with `git diff --stat` is a good middle ground; full diffs can be requested with `--full-diff`.","Should `osc evidence collect` be run automatically by `osc close \u003cslug\u003e` before closing the slice? Yes — `osc close` should offer to run `osc evidence collect` if the evidence note is a skeleton (unfilled), then proceed with close. This integrates 057 with the existing close workflow.","Should evidence collection support custom collector plugins (e.g., a `custom-collector.sh` that the user drops in `.osc/evidence/collectors/`)? Plugin architecture is future work; the 5 built-in collectors cover the most common evidence needs."]},{"slug":"058-doctor-auto-fix","path":".osc/plans/done/058-doctor-auto-fix.md","stage":"done","status":"active","goal":"Add `osc doctor [--fix] [--dry-run]` that can automatically repair common scaffold issues: misaligned plan status, missing changelog entries for existing amendment files, broken paired-view drift between CLAUDE.md and AGENTS.md, stale active plans (move to blocked/ with annotation), and missing `.osc/releases/README.md` — without ever modifying plan goals, acceptance criteria, or constraints.","criteria":[{"done":false,"text":"`osc doctor` (no flags) reports issues with severity (info/warn/error) and fixability (fixable/unfixable), with a human-readable description of each issue and what `--fix` would do."},{"done":false,"text":"`osc doctor --fix` repairs all fixable issues: plan `## Status` aligned to actual folder, changelog entries backfilled for amendment files, paired-view drift corrected, stale active plans moved to blocked/ with annotation, missing `.osc/releases/README.md` created."},{"done":false,"text":"`osc doctor --fix --dry-run` prints every planned change with before/after file paths and the exact mutation that would occur, without touching any file on disk."},{"done":false,"text":"Does NOT modify plan goals, acceptance criteria, constraints, or verification steps under any circumstances."},{"done":false,"text":"Does NOT edit MISSION.md sections other than `## Changelog`."},{"done":false,"text":"Exit code 0 when no unfixable issues remain after `--fix`; exit code 1 when unfixable issues remain (with a summary of what needs human attention)."},{"done":false,"text":"Reports what it CANNOT fix and why: ambiguous plan status (plan in done/ but content suggests in-progress), paired-view content conflicts (same section in both files but content differs meaningfully), and permission errors."},{"done":false,"text":"`osc doctor --check stale-plan` runs only the stale-plan checker, skipping all other diagnostics."},{"done":false,"text":"`osc doctor --severity error` reports only error-severity issues, suppressing info and warn."},{"done":false,"text":"Works in CI: no interactive prompts, clear exit codes, dry-run output is parseable."}],"openQuestions":["Should `osc doctor --fix` create a backup of modified files before repairing (e.g., `.osc/doctor-backups/`)? Git already provides rollback for committed files, but uncommitted plan drafts could be lost. A `--backup` flag that saves pre-repair copies to `.osc/doctor-backups/` would add safety without being default behavior. Start without backups; add if user feedback demands it.","Should stale-plan detection use file mtime, git log, or both? File mtime works on any filesystem but is unreliable (touched by `git checkout`, backup tools, etc.). Git log (`git log --follow --format\u003d%ci \u003cfile\u003e`) is more accurate but requires git. Use git log when available, fall back to mtime with a warning.","What threshold defines \"stale\"? 30 days is the default, but teams on different cadences may want 14 days or 90 days. Make stale threshold configurable via `.osc/config.json` with key `doctor.staleThresholdDays`, defaulting to 30.","Should `osc doctor --fix` be run automatically by `osc verify` or `osc status`? No — auto-fix should always require explicit intent. But `osc verify` could suggest running `osc doctor --fix` when it detects fixable issues.","Should doctor auto-fix be able to split a paired view section that has drifted in content (not just in presence/absence)? Content-level drift (same section heading in both files but different body text) indicates a real divergence that needs human judgment. Doctor should report it as unfixable and suggest a manual review, not attempt to merge the differing content."]},{"slug":"059-adoption-metrics","path":".osc/plans/done/059-adoption-metrics.md","stage":"done","status":"done","goal":"Add `osc metrics` that computes cycle time, stale plan count, close velocity, evidence completeness, and approval distribution from local scaffold state, with `--json` output for CI/dashboard consumption and `--since` for date-range filtering.","criteria":[{"done":false,"text":"`osc metrics` prints a table with: total plans by stage (active/backlog/done/blocked counts), average days from plan creation to close, median cycle time, p90 cycle time, stale active plans (\u003e30 days since last modification), close velocity (plans closed per week over the lookback window), evidence completeness (percentage of done plans with evidence notes), and approval distribution (approved/weak_approved/rejected/blocked counts)."},{"done":false,"text":"`osc metrics --json` outputs a single JSON object with keys `summary` (top-level counts), `cycle_time` (mean/median/p90/p99 in days), `stale` (count and list of slugs), `velocity` (plans/week), `evidence` (completeness percentage and per-plan detail), `approval` (distribution object). Output is valid JSON parseable by `jq`."},{"done":false,"text":"`osc metrics --since 2026-01-01` filters all calculations to only include plans created on or after the given date."},{"done":false,"text":"`osc metrics --lookback 4` calculates close velocity over the most recent 4 weeks instead of the default 12."},{"done":false,"text":"Works with zero plans: reports all zeros, no crash, exit code 0. Output says \"No plans found in scaffold — run `osc plan new` to create your first plan.\""},{"done":false,"text":"All data sourced from local filesystem only — no network activity during `osc metrics` execution (verify with network monitoring or by running offline)."},{"done":false,"text":"Reports when data is incomplete: \"8 plans closed but only 3 have evidence notes (37.5%)\" — clearly indicates data gaps without penalizing."},{"done":false,"text":"`osc metrics --verbose` includes per-plan breakdown: each plan's slug, stage, age in days, evidence status, and approval strength."},{"done":false,"text":"Cycle time uses git commit dates when available (more accurate); falls back to file mtime with a warning \"git not available — using file modification times for cycle time calculation\"."},{"done":false,"text":"Date parsing for `--since` handles ISO 8601 dates (`2026-01-01`), relative dates (`30 days ago`, `last month`), and rejects ambiguous formats with a clear error message."}],"openQuestions":["Should `osc metrics` also report amendment frequency (plans with 0/1/2+ amendments)? Plans with many amendments indicate scope volatility and could be a useful signal. Add as `--include-amendments` flag initially; promote to default if useful.","Should metrics track \"time in each stage\" (backlog → active → done) rather than just creation → close? Multi-stage timing requires tracking folder-move events, which we don't currently log. This would require a state-change log (`.osc/metrics-log.jsonl`) that records when a plan moves between folders. Future work.","Should `osc metrics` be runnable as a git hook or scheduled task that writes a metrics snapshot to `.osc/metrics/` for historical comparison? A `--snapshot` flag that writes the current metrics to `.osc/metrics/YYYY-MM-DD.json` would enable trend analysis over time without a database. Defer to future slice.","What's the right default lookback window for close velocity? 12 weeks (one quarter) provides enough data for meaningful velocity without being skewed by ancient history. Teams on 1-week sprint cycles may prefer 4 weeks; teams on monthly cycles may prefer 26 weeks. The 12-week default with `--lookback` override handles both.","Should metrics distinguish between \"plan created\" and \"plan activated\" (moved from backlog to active)? Currently the scaffold doesn't track activation time separately from creation time. If activation tracking is added later, metrics should update to use activation time as the start of the cycle time clock."]},{"slug":"060-mcp-server","path":".osc/plans/done/060-mcp-server.md","stage":"done","status":"done","goal":"Ship an MCP server that exposes Open Scaffold repository state as standard MCP tools and resources, so any MCP-compatible AI agent can list plans, read acceptance criteria, check verification status, navigate evidence, and query scaffold health without parsing markdown directly.","criteria":[{"done":false,"text":"`osc mcp serve` starts a stdio MCP server that responds to `initialize`, `tools/list`, `resources/list`, and `tools/call` JSON-RPC methods"},{"done":false,"text":"Tools exposed: `list_plans` (filters by stage: active|backlog|blocked|done), `get_plan` (returns all sections as structured JSON), `get_mission` (returns goals, non-goals, recent changelog), `list_evidence` (filters by slug), `get_evidence` (full content), `get_status` (scaffold health: mission defined, plan counts, stale warnings, verify result), `search_plans` (full-text search across plan goals and AC), `list_amendments` (amendments for a given plan slug)"},{"done":false,"text":"Resources exposed: `osc://plans/active` (list of active plan slugs), `osc://plans/backlog`, `osc://plans/done`, `osc://plans/blocked`, `osc://releases/latest` (most recent evidence note), `osc://mission/goals`, `osc://mission/changelog`, `osc://rules` (.osc/RULES.md content), `osc://roadmap` (ROADMAP.md content)"},{"done":false,"text":"All read operations work without `--allow-write`"},{"done":false,"text":"Write operations (`create_plan`, `amend_plan`, `close_plan`, `create_evidence`) return error JSON-RPC error code -32000 with message \"Write operations require --allow-write flag\" when flag is absent"},{"done":false,"text":"`osc mcp serve --validate` starts, validates scaffold state, outputs JSON status to stdout, and exits — useful for CI health checks and connection testing"},{"done":false,"text":"Server handles malformed JSON-RPC gracefully (returns parse error, does not crash)"},{"done":false,"text":"Server handles requests for nonexistent plans/evidence with structured error (not crash)"},{"done":false,"text":"Documentation explains registration config for at least 3 MCP clients with copy-pasteable JSON config blocks"},{"done":false,"text":"All existing tests pass (`npm test`), new MCP tests cover tool dispatch, resource resolution, read-only gate, and error handling"},{"done":false,"text":"`npm run build` succeeds with new files"},{"done":false,"text":"`./verify.sh --standard` passes (MCP files are additive, no plan/schema violations)"}],"openQuestions":["Should the MCP server use a separate npm package (`@graphanov/open-scaffold-mcp`) or ship inside the main `open-scaffold` package? Preference: ship inside main package for lower adoption friction; users shouldn't need two packages. Downside: main package gains a dependency on MCP SDK types.","Which MCP SDK to use? The official `@modelcontextprotocol/sdk` is the obvious choice but adds a dependency. Alternative: implement the JSON-RPC stdio loop directly (it's ~200 lines) to stay zero-dependency. Trade-off: zero-deps is cleaner but misses ecosystem compatibility testing and future protocol upgrades. Recommendation: zero-dependency implementation for v1 since MCP stdio transport is simple and stable enough.","Should resources use `osc://` URI scheme or `open-scaffold://`? `osc://` is shorter and matches the CLI brand. Confirm with owner.","Should `get_plan` return raw markdown or parsed JSON? Both: parsed JSON as the primary output (sections, AC, files, etc.) with a `raw_markdown` field for tools that want the original text."]},{"slug":"061-local-task-database","path":".osc/plans/done/061-local-task-database.md","stage":"done","status":"done","goal":"Ship a lightweight, SQLite-backed local task database with `osc task` subcommands (new, list, claim, start, complete, comment, link) that gives solo developers and small teams basic durable task tracking without requiring any external system.","criteria":[{"done":false,"text":"`osc task new \"Fix login redirect bug\" --priority high --plan 050-npm-publish` creates a task with auto-generated ID (T-001), sets status to `todo`, stores timestamp, and prints the task ID"},{"done":false,"text":"`osc task list` shows all tasks with ID, status, priority, title, and linked plan (if any) in a readable table"},{"done":false,"text":"`osc task list --status todo` filters to tasks with that status"},{"done":false,"text":"`osc task list --priority high` filters by priority"},{"done":false,"text":"`osc task list --plan 050-npm-publish` filters by linked plan"},{"done":false,"text":"`osc task show T-001` displays full task details including all comments with timestamps"},{"done":false,"text":"`osc task claim T-001` transitions task from `todo` to `in-progress` and records the transition timestamp"},{"done":false,"text":"`osc task start T-001` is an alias for `claim` (ergonomic — matches common mental model of \"starting\" work)"},{"done":false,"text":"`osc task complete T-001` transitions to `done` with completion timestamp"},{"done":false,"text":"`osc task block T-001 --reason \"Waiting for npm access token\"` transitions to `blocked` with a reason stored in the task"},{"done":false,"text":"`osc task cancel T-001` transitions to `cancelled`"},{"done":false,"text":"`osc task comment T-001 \"Investigated: the redirect uses window.location not router.push\"` adds a timestamped comment to the task"},{"done":false,"text":"`osc task link T-001 --plan 060-mcp-server` adds or changes the linked plan"},{"done":false,"text":"Tasks survive between CLI invocations — close terminal, reopen, `osc task list` shows same tasks (SQLite persistence verified)"},{"done":false,"text":"`osc status` includes task summary counts when `.osc/tasks.db` exists (e.g., \"Tasks: 3 todo, 2 in-progress, 12 done\")"},{"done":false,"text":"Commands fail gracefully when no tasks.db exists: `osc task list` outputs \"No tasks yet. Create one with `osc task new \u003ctitle\u003e`\""},{"done":false,"text":"`osc task list --json` outputs machine-parseable JSON array for CI/scripting"},{"done":false,"text":"Existing tests pass, new task tests cover all CRUD operations and edge cases"}],"openQuestions":["Should `osc task` use a separate WAL-mode SQLite file or a simpler JSON file? SQLite is preferred for durability and query flexibility (filtering by status/priority/plan is trivial with SQL, painful with grep on JSON). Trade-off: adds a native dependency or uses better-sqlite3 (native addon) or sql.js (WASM). Recommendation: use `better-sqlite3` for performance, with graceful fallback message if native build fails (\"Install with npm install --build-from-source or use GitHub Issues for task tracking\").","Should task IDs be globally unique or per-project? Auto-increment simple integers (T-001, T-002) are local to the DB file. This is sufficient for local use. If multiple repos share tasks, they'd use GitHub Issues.","Should completed tasks be archived or kept in the active DB? Keep all tasks in the DB; filtering by status handles the UX. Archival could be a future `osc task archive` command.","Should `osc task` support tags/labels in v1? Defer — add after priority proves useful. Tags add schema complexity (many-to-many) without clear demand signal."]},{"slug":"062-glass-cockpit-webhooks","path":".osc/plans/done/062-glass-cockpit-webhooks.md","stage":"done","status":"done","goal":"Ship `osc cockpit post` and `osc cockpit test` commands that send structured glass-cockpit events to configured Discord and Slack webhooks, proving the protocol with working, credential-safe implementation.","criteria":[{"done":false,"text":"`.osc/cockpit.example.json` exists with documented format: `{\"targets\":[{\"platform\":\"discord\",\"webhookUrl\":\"https:\/\/discord.com/api/webhooks/...\",\"events\":[\"status\",\"completion_report\"]},{\"platform\":\"slack\",\"webhookUrl\":\"https:\/\/hooks.slack.com/services/...\",\"events\":[\"blocker\",\"approval_request\"]}]}`"},{"done":false,"text":"`osc cockpit config` prints the configured targets with masked webhook URLs (show first 20 chars + \"...\"), and warns if no config exists"},{"done":false,"text":"`osc cockpit test --dry-run` prints the test message that would be sent without sending (validates config format, message structure)"},{"done":false,"text":"`osc cockpit test` sends a test message to all configured targets, reports success/failure per target"},{"done":false,"text":"`osc cockpit post --event status --message \"Plan 062 in progress: implementing webhook dispatch\"` posts to all targets whose `events` list includes `status`"},{"done":false,"text":"`osc cockpit post --event completion_report --run-id 20260518T120000Z-062 --plan 062-glass-cockpit-webhooks --pr \"https:\/\/github.com/graphanov/open-scaffold/pull/56\"` posts structured completion report with run ID, plan slug, and PR link"},{"done":false,"text":"`osc cockpit post --event evidence_receipt --evidence-path \".osc/releases/2026-05-18-062-glass-cockpit-webhooks.md\"` posts evidence receipt linking the evidence file"},{"done":false,"text":"`osc cockpit post --event blocker --message \"Blocked: waiting for webhook URL approval\"` posts blocker event"},{"done":false,"text":"`osc cockpit post --event approval_request --message \"Please review PR #56: 20 backlog items\"` posts approval request"},{"done":false,"text":"`osc cockpit post --dry-run` prints exactly what would be sent (platform, URL masked, message body) without sending"},{"done":false,"text":"When no `.osc/cockpit.json` exists, all commands gracefully report \"No cockpit targets configured. See .osc/cockpit.example.json\" (exit 0, not error)"},{"done":false,"text":"When a webhook POST fails (4xx/5xx), error message includes the platform name, HTTP status, and response body snippet (not the full webhook URL)"},{"done":false,"text":"Messages include a footer with `osc cockpit` version and repo path"},{"done":false,"text":"Discord messages use embed format (title, description, fields for structured data like run_id/plan/task, color-coded by event type: green\u003dcompletion, red\u003dblocker, yellow\u003dapproval_request, blue\u003dstatus)"},{"done":false,"text":"Slack messages use Block Kit format for structured, readable messages"},{"done":false,"text":"All existing tests pass, new cockpit tests cover formatting, config handling, dry-run, and error cases"},{"done":false,"text":"`npm run build` succeeds"}],"openQuestions":["Should cockpit events auto-post during `osc close` and `osc evidence new`? That is, should the lifecycle commands automatically post to configured cockpits? This would be a natural next step but adds complexity to commands that are currently filesystem-only. Defer to a follow-up plan — keep v1 as explicit `osc cockpit post` only.","Should `osc cockpit post` infer event type from the command context? E.g., `osc cockpit post --run-id X --status completed` auto-sets event to `completion_report`. This is a nice-to-have but adds ambiguity. Keep explicit `--event` flag for clarity in v1."]},{"slug":"063-github-actions-ci-templates","path":".osc/plans/done/063-github-actions-ci-templates.md","stage":"done","status":"done","goal":"Ship 4 production-grade GitHub Actions workflow templates plus a CI strategy guide, so scaffold projects get automated plan validation, stale plan detection, evidence verification, and npm publishing from day one.","criteria":[{"done":false,"text":"`plan-validate.yml`: triggers on PRs that touch `.osc/plans/**/*.md` files. Checks out full history. Runs `osc plan validate \u003ceach-changed-plan\u003e`. Fails PR if any plan has errors (missing sections, TODOs, empty AC). Passes if only warnings."},{"done":false,"text":"`stale-plans.yml`: triggers on `schedule: cron(0 9 * * 1)` (Monday 9am UTC) and `workflow_dispatch` (manual trigger). Scans `.osc/plans/active/` for plans with mtime \u003e30 days. If stale plans found, opens a GitHub Issue titled \"Stale active plans — week of YYYY-MM-DD\" with plan names, last modified dates, and suggestion to move to `blocked/` or `done/`. If no stale plans, workflow passes silently (no issue)."},{"done":false,"text":"`evidence-validate.yml`: triggers on PRs touching `.osc/releases/**/*.md`. Runs `./verify.sh --strict`. Validates that evidence notes have all required sections (Summary, Traceability, Verification, Outcome). Fails if evidence note says \"pending\" while citing merged PR or closed issue (stale evidence detection)."},{"done":false,"text":"`npm-publish.yml`: triggers on tag push matching `v*`. Runs `npm ci \u0026\u0026 npm run build \u0026\u0026 npm test`. If all pass, runs `npm publish`. Uses `NPM_TOKEN` secret. Does NOT run on regular pushes or PRs."},{"done":false,"text":"All workflows are valid YAML (pass `actionlint` or manual syntax check)."},{"done":false,"text":"`docs/CI.md` explains: what each workflow does, how to enable/disable, how to customize stale days threshold, how to test locally with `act`, and how to adapt for private npm registries."},{"done":false,"text":"Existing `.github/workflows/ci.yml` continues to work alongside new workflows (no conflicts)."},{"done":false,"text":"Workflows are tested: at minimum, dry-run validation via `act` or manual YAML schema check. Ideally, push a test branch and verify at least `plan-validate.yml` runs in CI."}],"openQuestions":["Should `stale-plans.yml` automatically move stale plans to `blocked/` instead of just opening an issue? Decision: no — auto-mutation of plan state from CI is too aggressive. Opening an issue is the right level of automation; the human decides.","Should the npm publish workflow also create a GitHub Release with auto-generated release notes? This would be a natural enhancement. Keep v1 minimal (publish only) and add release creation in a follow-up.","Should workflows be opt-in (in a `templates/` directory) or active by default (in `.github/workflows/`)? Active by default — they're harmless if the repo doesn't have plans/evidence yet (they'll just pass with zero findings), and they provide immediate value when plans are created."]},{"slug":"066-web-dashboard-amendment-1","path":".osc/plans/done/066-web-dashboard-amendment-1.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"066-web-dashboard","path":".osc/plans/done/066-web-dashboard.md","stage":"done","status":"done","goal":"Ship `osc dashboard --web` that generates a single self-contained HTML page from scaffold state, and `osc dashboard --serve` that serves it locally, providing a browser-based glass cockpit for Open Scaffold projects.","criteria":[{"done":false,"text":"`osc dashboard --web` generates a self-contained `.osc/dashboard.html` file (or outputs to `--out \u003cpath\u003e`)"},{"done":false,"text":"`osc dashboard --serve` starts a local HTTP server, prints the URL, and serves the dashboard"},{"done":false,"text":"The HTML page displays: mission summary (goals excerpt), plan kanban columns (active, backlog, blocked, done) with plan names and status, recent evidence notes with links, verification status indicator, identity chain visualization (roadmap → plan → run → PR → evidence), and task summary if `.osc/tasks.db` exists"},{"done":false,"text":"Clicking a plan name expands it inline to show goal, acceptance criteria (with check marks for completed), and open questions"},{"done":false,"text":"The page uses a dark theme with clean typography, subtle borders, and color-coded status indicators (green\u003ddone, yellow\u003dstale, red\u003dblocked, blue\u003dactive)"},{"done":false,"text":"The page is responsive — works on desktop and mobile viewports"},{"done":false,"text":"The page has zero external dependencies: no `\u003clink\u003e` tags to external CSS, no `\u003cscript src\u003d\"...\"\u003e` to external JS, no CDN fonts, no analytics"},{"done":false,"text":"Opening the generated `.osc/dashboard.html` as a `file://` URL works without errors (no CORS issues, no blocked fetches)"},{"done":false,"text":"`osc dashboard --serve --port 9999` serves on that port and prints `http:\/\/localhost:9999`"},{"done":false,"text":"`osc dashboard --serve` exits cleanly on Ctrl+C (SIGINT handled)"},{"done":false,"text":"Generated HTML is committed to `.osc/dashboard.html` so it can be viewed directly on GitHub Pages or raw git hosting"},{"done":false,"text":"All existing tests pass; new web dashboard tests cover HTML generation and serve mode"}],"openQuestions":["Should the dashboard include a Mermaid.js diagram of the identity chain (roadmap → plan → run → PR → evidence)? Mermaid is an external CDN dependency — violates the self-contained constraint. Alternative: render an ASCII art diagram or simple CSS-only flowchart. Decision: simple CSS flowchart for v1. Mermaid can be added as an optional `--with-mermaid` flag that acknowledges the CDN dependency.","Should `osc dashboard --serve` support `--open` to auto-open the browser? Yes — a common UX expectation. Add `--open` flag that uses `open` (macOS), `xdg-open` (Linux), or `start` (Windows).","Should `.osc/dashboard.html` be gitignored or tracked? Track it — it's a generated artifact that represents repo state at a point in time. Similar to `.osc/releases/` evidence notes. Users can regenerate it anytime."]},{"slug":"074-package-public-surface-sync","path":".osc/plans/done/074-package-public-surface-sync.md","stage":"done","status":"active","goal":"Make the public install/package surface truthful again: decide the next version/publish action, ensure npm metadata and README/docs match the package users actually receive, and make the runtime package distribution story explicit before any owner-approved publish.","criteria":[{"done":false,"text":"`npm view open-scaffold version time dist-tags --json` is compared against local `package.json` and the intended release version."},{"done":false,"text":"`npx --yes open-scaffold@latest --help` is compared against `node dist/cli.js --help`, and any remaining command-surface drift is either fixed by an owner-approved publish or explicitly documented as pending."},{"done":false,"text":"`npm view open-scaffold --json` metadata has repository, homepage, bugs, license, description, and keywords after the next publish."},{"done":false,"text":"`npm pack --dry-run --json` confirms no private/dogfood payload ships and records an explicit package footprint budget or rationale."},{"done":false,"text":"Shipped docs do not imply that `packages/runtime-omx/` is available inside the root `open-scaffold` npm payload unless that path is actually included or clearly labeled as a repo/GitHub path."},{"done":false,"text":"The runtime package distribution contract is explicit: root-package-included, separately published package, or repo-only example for now."},{"done":false,"text":"No npm publish is performed until the owner approves the exact version and command."}],"openQuestions":["Should the next package release be a patch (`0.4.2`) for metadata/command-surface sync, or a minor (`0.5.0`) if runtime package distribution wording changes materially?","Should `packages/runtime-omx/` be included in the root package, published separately, or kept as a GitHub-only repo example until a dedicated runtime-package release plan?","Should the GitHub Release marked Latest move with the next package publish, or should repo-native release/evidence notes remain sufficient until a larger user-facing release?"]},{"slug":"075-brownfield-package-release-sync","path":".osc/plans/done/075-brownfield-package-release-sync.md","stage":"done","status":"done","goal":"Prepare the smallest package/public-surface sync needed for brownfield init: bump the package release candidate, verify the tarball and command surface, record evidence, and leave npm publish / GitHub Release as explicit owner gates.","criteria":[{"done":false,"text":"Local `node dist/cli.js --help` exposes `osc init --from-existing --tier min --target \u003cdir\u003e [--force]`."},{"done":false,"text":"`npm view er-approved publish."},{"done":false,"text":"`npm pack --dry-run --json` succeeds and confirms the package payload remains public-safe: no `.osc/research/`, `.osc/runs/`, `.osc/plans/done/`, or `.osc/plans/backlog/` payload."},{"done":false,"text":"`npm publish --dry-run` succeeds for the release candidate."},{"done":false,"text":"Build, tests, strict scaffold verification, and whitespace checks pass."},{"done":false,"text":"Evidence states the exact owner gate for real `npm publish` and GitHub Release creation."}],"openQuestions":["Patch or minor version: default assumption is patch (`0.4.4`) because this exposes an already-merged CLI adoption helper without changing runtime boundaries.","Publish gate: owner approval is required before running real `npm publish` or creating/updating the GitHub Release marked Latest."]},{"slug":"077-npm-trusted-publishing-workflow","path":".osc/plans/done/077-npm-trusted-publishing-workflow.md","stage":"done","status":"done","goal":"Add the repo-side trusted publishing workflow and evidence needed for the owner to bind npm package `open-scaffold` to GitHub Actions and publish `0.4.4` through a manually dispatched workflow.","criteria":[{"done":false,"text":"`.github/workflows/publish-npm.yml` exists and uses `workflow_dispatch` with explicit `expected-version` and `npm-tag` inputs."},{"done":false,"text":"The workflow grants `id-token: write` and `contents: read`, uses a GitHub-hosted Ubuntu runner, installs a current npm CLI, runs build/tests/strict scaffold verification, checks that the requested version matches `package.json`, refuses already-published versions, and runs `npm publish --provenance` without an npm token."},{"done":false,"text":"The release/evidence note records exact npm trusted publisher UI fields: GitHub Actions, owner `graphanov`, repository `open-scaffold`, workflow filename `publish-npm.yml`, and no environment name unless a protected environment is later added."},{"done":false,"text":"No npm token, OTP, brows ration."},{"done":true,"text":"The approved final README media shows context/session loss, fresh session, `.osc/plans/active/` or equivalent repo-truth inspection, and resumable next action."},{"done":true,"text":"The README embeds or links the approved media and replaces the text-only demo with concise show-first copy."},{"done":true,"text":"The committed media is public-safe, readable at README scale, and stays outside the npm package payload unless a package-files decision is explicitly made."},{"done":true,"text":"Release/evidence records media generation, verification, owner taste decision, and follow-up boundaries."},{"done":true,"text":"`npm run build`, `npm test`, `./verify.sh --strict`, `git diff --check`, and media duration/size checks pass before PR."}],"openQuestions":["Taste gate resolved: owner approved the boxes-only premium GIF rather than the earlier CRT/pixel or fuller premium copy variants.","README format resolved: direct GIF embed in README, with the MP4 committed as a review/archive render in `.github/assets/`."]},{"slug":"080-readme-resume-screencast-dark-theme","path":".osc/plans/done/080-readme-resume-screencast-dark-theme.md","stage":"done","status":"done","goal":"Replace the README resume-loop media with a dark premium graphite variant of the approved boxes-only GIF.","criteria":[{"done":true,"text":"PR 68 is verified merged and local `main` is fast-forwarded."},{"done":true,"text":"Dark-theme GIF/MP4 exist and preserve the boxes-only story."},{"done":true,"text":"HyperFrames lint/validate/inspect pass with no blocking issues."},{"done":true,"text":"Dense visual QA confirms readability, no overlaps, no neon/cyber drift, and no external copy."},{"done":true,"text":"README media files are replaced without changing README copy or npm package payload intent."},{"done":true,"text":"Evidence records media generation, sizes, checksums, package payload behavior, and verification."},{"done":true,"text":"`npm run build`, `npm test -- --run`, `npm pack --dry-run --json`, `./verify.sh --strict`, and `git diff --check` pass before PR."}],"openQuestions":["None. Owner requested dark-theme replacement directly."]},{"slug":"081-lifecycle-help-flags","path":".osc/plans/done/081-lifecycle-help-flags.md","stage":"done","status":"done","goal":"Make plan lifecycle help flags print command-specific usage with exit code 0 instead of treating `--help` as a plan path, slug, or missing option.","criteria":[{"done":true,"text":"`osc plan --help` exits 0 and prints plan-specific usage."},{"done":true,"text":"`osc plan new --help`, `osc plan move --help`, `osc plan validate --help`, and `osc plan wizard --help` exit 0 and print subcommand-specific usage."},{"done":true,"text":"`osc amend --help` and `osc close --help` exit 0 and print lifecycle usage instead of unsafe-slug errors."},{"done":true,"text":"Existing lifecycle behavior and validation remain unchanged."}],"openQuestions":["None."]},{"slug":"082-evidence-new-plan-validation","path":".osc/plans/done/082-evidence-new-plan-validation.md","stage":"done","status":"done","goal":"Make `osc evidence new \u003cslug\u003e` require a matching plan in `.osc/plans/{active,backlog,blocked,done}` before writing a release/evidence note, aligning it with `osc evidence collect` and preserving the plan-to-evidence chain.","criteria":[{"done":false,"text":"`osc evidence new \u003cexisting-plan-slug\u003e` still creates `.osc/releases/YYYY-MM-DD-\u003cslug\u003e.md` with the existing skeleton content."},{"done":false,"text":"`osc evidence new \u003cmissing-plan-slug\u003e` exits non-zero and does not create a release/evidence note."},{"done":false,"text":"The missing-plan error tells the user the matching plan was not found in `.osc/plans/{active,backlog,blocked,done}`."},{"done":false,"text":"Existing duplicate, unsafe slug, and missing-root evidence helper checks still pass."},{"done":false,"text":"Standard Open Scaffold verification, targeted evidence tests, full test suite, and build p e-plan issue creation, and version-tag npm publishing. Added a CI strategy guide and linked the workflow set from the GitHub workflow guide."},{"file":"2026-05-23-098-omo-security-hardening-package-sync.md","path":".osc/releases/2026-05-23-098-omo-security-hardening-package-sync.md","dashboardHref":"releases/2026-05-23-098-omo-security-hardening-package-sync.md","title":"098 — OmO Security Hardening Package Sync","summary":"PR #103 added release/security posture hardening to `main`: pinned npm in the trusted publishing job, Dependabot coverage, `SECURITY.md`, package payload inclusion for `SECURITY.md`, optional native dependency guidance, and runtime/cockpit trust-boundary wording."},{"file":"2026-05-23-096-glass-cockpit-webhooks-public-surface-sync.md","path":".osc/releases/2026-05-23-096-glass-cockpit-webhooks-public-surface-sync.md","dashboardHref":"releases/2026-05-23-096-glass-cockpit-webhooks-public-surface-sync.md","title":"096 — Glass Cockpit Webhooks Public-Surface Sync","summary":"PR #100 added push-only glass-cockpit webhook commands to repo `main`: `osc cockpit config`, `osc cockpit test`, and `osc cockpit post`. Because `open-scaffold@0.4.16` was already published before that work reached `main`, fresh public `npx open-scaffold@latest cockpit --help` still serves the older package and does not expose the cockpit command."},{"file":"2026-05-23-095-local-task-database-public-surface-sync.md","path":".osc/releases/2026-05-23-095-local-task-database-public-surface-sync.md","dashboardHref":"releases/2026-05-23-095-local-task-database-public-surface-sync.md","title":"095 — Local Task Database Public-Surface Sync","summary":"PR #96 added the optional local SQLite task database CLI to repo `main`. PR #97 published `open-scaffold@0.4.15`, which exposed `osc task`, but post-publish verification caught a packaged `osc init` regression before the GitHub Latest Release gate. This follow-up prepares `open-scaffold@0.4.16` so the local task database work and packaged <script>
const data = JSON.parse(document.getElementById('osc-dashboard-data').textContent);
const stages = ['active', 'backlog', 'blocked', 'done'];
const labels = { active: 'Active', backlog: 'Backlog', blocked: 'Blocked', done: 'Done' };
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
const allPlans = stages.flatMap((stage) => data.plans[stage] || []);
document.getElementById('generated').textContent = data.rootName + ' • generated ' + new Date(data.generatedAt).toLocaleString();
function renderMission() {
  const goals = data.mission.goals.length ? '<ul>' + data.mission.goals.map((goal) => '<li>' + esc(goal) + '</li>').join('') + '</ul>' : '<p class="muted">No mission goals listed.</p>';
  return '<section class="card span-7"><h2>Mission</h2><p>' + esc(data.mission.excerpt) + '</p>' + goals + '</section>';
}
function renderValidation() {
  const cls = data.validation.ok ? 'ok' : 'bad';
  const label = data.validation.ok ? 'Verification shape passes' : 'Verification needs attention';
  const taskText = data.tasks.exists && data.tasks.summary ? Object.entries(data.tasks.summary.counts).map(([k,v]) => esc(k) + ': ' + esc(v)).join(', ') : (data.tasks.exists ? 'Task database found; summary unavailable' : 'No local task database');
  return '<section class="card span-5"><h2>Verification status</h2><p class="' + cls + '">' + label + '</p><p class="muted">Failures: ' + esc(data.validation.failures) + ' • warnings: ' + esc(data.validation.warnings) + '</p><h3>Tasks</h3><p class="muted">' + taskText + '</p></section>';
}
function renderKpis() {
  const counts = stages.map((stage) => '<div class="kpi"><b>' + esc((data.plans[stage] || []).length) + '</b><span>' + labels[stage] + '</span></div>').join('');
  return '<section class="card"><h2>Plan state</h2><div class="kpis">' + counts + '<div class="kpi"><b>' + esc(data.evidence.length) + '</b><span>Recent evidence</span></div></div></section>';
}
function planDetail(plan) {
  const criteria = plan.criteria.length ? '<ul>' + plan.criteria.map((item) => '<li><span class="' + (item.done ? 'check' : 'uncheck') + '">' + (item.done ? '✓' : '□') + '</span>' + esc(item.text) + '</li>').join('') + '</ul>' : '<p>No acceptance criteria listed.</p>';
  const questions = plan.openQuestions.length ? '<p><strong>Open questions</strong></p><ul>' + plan.openQuestions.map((q) => '<li>' + esc(q) + '</li>').join('') + '</ul>' : '<p>No open questions.</p>';
  return '<div class="plan-detail"><p><strong>Goal:</strong> ' + esc(plan.goal || 'No goal recorded.') + '</p><p><strong>Acceptance criteria</strong></p>' + criteria + questions + '<p><small>' + esc(plan.path) + '</small></p></div>';
}
function renderColumns() {
  if (!allPlans.length) return '<section class="card"><h2>Plan kanban</h2><div class="empty">No plans yet.</div></section>';
  const columns = stages.map((stage) => {
    const cards = (data.plans[stage] || []).map((plan) => '<button type="button" class="plan" aria-expanded="false"><strong>' + esc(plan.slug) + '</strong><small>' + esc(plan.status || stage) + '</small>' + planDetail(plan) + '</button>').join('') || '<div class="empty">No plans in ' + labels[stage].toLowerCase() + '.</div>';
    return '<div class="column"><div class="column-title"><span><span class="status-dot status-' + stage + '"></span> ' + labels[stage] + '</span><span>' + esc((data.plans[stage] || []).length) + '</span></div>' + cards + '</div>';
  }).join('');
  return '<section class="card"><h2>Plan kanban</h2><div class="columns">' + columns + '</div></section>';
}
function renderFlow() {
  const steps = [
    ['Roadmap', data.identityChain.roadmap ? 'present' : 'missing'],
    ['Plans', data.identityChain.plans],
    ['Runs', data.identityChain.runs],
    ['PR traces', data.identityChain.prs],
    ['Evidence', data.identityChain.evidence],
  ].map(([name, value]) => '<div class="flow-step"><strong>' + esc(name) + '</strong><p class="muted">' + esc(value) + '</p></div>').join('');
  return '<section class="card span-6"><h2>Identity chain</h2><div class="flow">' + steps + '</div></section>';
}
function renderEvidence() {
  const notes = data.evidence.length ? data.evidence.map((note) => '<article class="evidence"><strong>' + esc(note.title) + '</strong><p>' + esc(note.summary) + '</p><a class="muted" href="' + esc(note.dashboardHref) + '">' + esc(note.path) + '</a></article>').join('') : '<div class="empty">No evidence notes yet.</div>';
  return '<section class="card span-6"><h2>Recent evidence</h2><div class="evidence-list">' + notes + '</div></section>';
}
document.getElementById('dashboard').innerHTML = '<div class="grid">' + renderMission() + renderValidation() + renderKpis() + renderColumns() + renderFlow() + renderEvidence() + '</div>';
document.querySelectorAll('.plan').forEach((button) => button.addEventListener('click', () => button.setAttribute('aria-expanded', button.getAttribute('aria-expanded') !== 'true')));
document.getElementById('theme-toggle').addEventListener('click', () => {
  const body = document.body;
  const next = body.dataset.theme === 'system' ? 'dark' : 'system';
  body.dataset.theme = next;
  document.getElementById('theme-toggle').textContent = next === 'system' ? 'Use dark theme' : 'Use system theme';
});
</script>
</body>
