<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Scaffold Dashboard</title>
<style>
:root { color-scheme: dark; --bg:#090a0c; --panel:#111318; --panel2:#171a20; --text:#f4f4f0; --muted:#a6a8ad; --line:#2a2e36; --active:#6ea8fe; --done:#63d471; --blocked:#ff6b6b; --backlog:#f6c453; --accent:#ff4d4d; --shadow:0 24px 80px rgba(0,0,0,.35); }
body[data-theme="system"] { color-scheme: light dark; }
@media (prefers-color-scheme: light) { body[data-theme="system"] { --bg:#f6f5f1; --panel:#ffffff; --panel2:#f0eee8; --text:#151515; --muted:#575b63; --line:#d9d6ce; --active:#1c64d1; --done:#238636; --blocked:#d1242f; --backlog:#9a6700; --accent:#d1242f; --shadow:0 24px 80px rgba(20,20,20,.12); } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; font:15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 32rem), var(--bg); color:var(--text); }
.wrap { width:min(1180px, calc(100vw - 32px)); margin:0 auto; padding:32px 0 48px; }
header { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; margin-bottom:24px; }
.eyebrow { color:var(--accent); letter-spacing:.16em; text-transform:uppercase; font-size:12px; font-weight:800; }
h1 { margin:.2rem 0 .6rem; font-size:clamp(2rem, 7vw, 5.25rem); line-height:.92; letter-spacing:-.07em; }
p { margin:.25rem 0; }
button { font:inherit; color:inherit; }
.theme { border:1px solid var(--line); background:var(--panel); padding:10px 12px; cursor:pointer; box-shadow:var(--shadow); }
.grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
.card { grid-column:span 12; border:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.035), transparent), var(--panel); box-shadow:var(--shadow); padding:18px; }
.card h2, .card h3 { margin:.1rem 0 .8rem; letter-spacing:-.03em; }
.card h2 { font-size:1.2rem; }
.muted { color:var(--muted); }
.kpis { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; }
.kpi { background:var(--panel2); border:1px solid var(--line); padding:12px; min-height:82px; }
.kpi b { display:block; font-size:1.7rem; line-height:1; margin-bottom:.4rem; }
.columns { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
.column { border:1px solid var(--line); background:rgba(255,255,255,.025); padding:12px; min-width:0; }
.column-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; text-transform:uppercase; font-size:12px; letter-spacing:.12em; color:var(--muted); }
.status-dot { width:10px; height:10px; display:inline-block; border-radius:999px; background:var(--muted); }
.status-active { background:var(--active); } .status-backlog { background:var(--backlog); } .status-blocked { background:var(--blocked); } .status-done { background:var(--done); }
.plan { width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); padding:11px; margin:0 0 8px; cursor:pointer; }
.plan strong { display:block; overflow-wrap:anywhere; }
.plan small { color:var(--muted); }
.plan-detail { display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); }
.plan[aria-expanded="true"] .plan-detail { display:block; }
.check { color:var(--done); font-weight:800; margin-right:6px; }
.uncheck { color:var(--muted); margin-right:6px; }
.flow { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; align-items:stretch; }
.flow-step { position:relative; border:1px solid var(--line); background:var(--panel2); padding:12px; min-height:86px; }
.flow-step:not(:last-child)::after { content:"→"; position:absolute; right:-14px; top:50%; transform:translateY(-50%); color:var(--accent); font-weight:900; }
.evidence-list { display:grid; gap:10px; }
.evidence { border:1px solid var(--line); background:var(--panel2); padding:12px; }
.badge { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); padding:5px 8px; margin:3px 6px 3px 0; background:var(--panel2); }
.ok { color:var(--done); } .warn { color:var(--backlog); } .bad { color:var(--blocked); }
.empty { border:1px dashed var(--line); padding:14px; color:var(--muted); }
@media (min-width: 760px) { .span-5 { grid-column:span 5; } .span-7 { grid-column:span 7; } .span-6 { grid-column:span 6; } }
@media (max-width: 860px) { header, .columns, .flow, .kpis { grid-template-columns:1fr; } .flow-step:not(:last-child)::after { display:none; } .wrap { width:min(100vw - 20px, 1180px); padding-top:20px; } }
</style>
</head>

<script id="osc-dashboard-data" type="application/json">{"schema":"open-scaffold.web_dashboard.v1","generatedAt":"2026-05-25T11:56:13.702Z","rootName":"open-scaffold","namespace":".osc","mission":{"defined":true,"excerpt":"Open Scaffold is a runtime-neutral, repo-native operating system for agent-orchestrated development: a portable methodology and repository protocol that lets humans, AI agents, and orchestrators plan, execute, verify, publish, and evolve software work without losing context or ownership.","goals":["Provide a durable project substrate: mission, roadmap, plans, amendments, evidence, run packets, decisions, and handoffs as git-tracked files.","Support any capable orchestrator or agent runtime — Hermes, Claw/OpenClaw, Claude Code, Codex, Gemini, or future tools — without making any one runtime the canonical brain.","Define clear integration boundaries between orchestrators, runtime harnesses, operator surfaces, repository truth, and GitHub issue/PR workflows.","Productize the closed evolutionary loop: slice work, capture feedback, amend plans, verify against acceptance criteria, and feed learnings into the next slice.","Ship a Discord glass-cockpit pattern for private control rooms, team control rooms, and build-in-public workflows while keeping durable truth in the repo/GitHub/task system."]},"plans":{"active":[{"slug":"064-devcontainer-profile-amendment-1","path":".osc/plans/active/064-devcontainer-profile-amendment-1.md","stage":"active","status":"active","goal":"","criteria":[],"openQuestions":[]},{"slug":"064-devcontainer-profile","path":".osc/plans/active/064-devcontainer-profile.md","stage":"active","status":"active","goal":"Ship a `.devcontainer/devcontainer.json` and `Dockerfile` that pre-installs the `osc` CLI, Node.js, and git, so any developer can clone and start working in a fully-configured environment within seconds.","criteria":[{"done":false,"text":"`.devcontainer/devcontainer.json` is valid JSONC and references the Dockerfile correctly"},{"done":false,"text":"`Dockerfile` builds successfully with `docker build -t osc-devcontainer -f .devcontainer/Dockerfile .devcontainer/`"},{"done":false,"text":"Container starts with `osc` available in PATH — `docker run --rm osc-devcontainer osc --version` prints version"},{"done":false,"text":"Container has Node.js and npm available — `docker run --rm osc-devcontainer node --version` prints v22.x"},{"done":false,"text":"Container has git available — `docker run --rm osc-devcontainer git --version` prints version"},{"done":false,"text":"`devcontainer.json` includes `postCreateCommand` that runs `npm install` (so dependencies are ready after container creation)"},{"done":false,"text":"VS Code devcontainer flow works end-to-end: clone repo, \"Reopen in Container\", wait for build, open terminal, run `osc status` — works"},{"done":false,"text":"GitHub Codespaces: if the repo is opened in Codespaces, it detects `.devcontainer/` and builds the environment automatically"},{"done":false,"text":"`.devcontainer/README.md` explains the setup in 3 sentences, with links to VS Code and Codespaces docs"},{"done":false,"text":"`docs/DEV_CONTAINER.md` covers: prerequisites (Docker, VS Code), first launch walkthrough, customization (adding extensions, changing Node version), troubleshooting (port conflicts, rebuild), and how to use without VS Code (plain Docker)"},{"done":false,"text":"`README.md` mentions dev container support alongside the npm init path"},{"done":false,"text":"`osc init --tier standard --target \u003cdir\u003e` generates a `.devcontainer/` in the target project (so downstream projects inherit container support)"},{"done":false,"text":"`npm test` and `./verify.sh --standard` pass (devcontainer files are additive, no plan/schema impact)"}],"openQuestions":["Should the Dockerfile install `osc` globally via `npm install -g open-scaffold` (requires npm publish, plan 050) or build from local source? Decision: build from local source in the Dockerfile for self-containment (doesn't depend on npm registry). After plan 050 ships npm publish, add the `npm install -g` path as an alternative documented in `docs/DEV_CONTAINER.md`.","Should `.devcontainer/` be generated by `osc init --tier standard` or only `--tier max`? `standard` is the recommended starter — it should include devcontainer support. `min` should not (keep it as small as possible).","Post-create command: `npm install` is the obvious choice, but should it also run `npm run build`? Yes — the user should be able to run `osc` commands immediately without manual build step."]}],"backlog":[{"slug":"065-tui-dashboard","path":".osc/plans/backlog/065-tui-dashboard.md","stage":"backlog","status":"backlog","goal":"Ship `osc dashboard` (or `osc status --dashboard`) — an interactive terminal dashboard that displays active plans with status, recent evidence, stale warnings, verification health, and the identity chain in a single refreshing view.","criteria":[{"done":false,"text":"`osc dashboard` starts a full-screen terminal UI showing at minimum: header with project name and mission status, active plans pane (plan name, last modified, staleness indicator), backlog count, done count, blocked count, recent evidence (last 3 evidence notes), and a footer with keyboard shortcuts"},{"done":false,"text":"Active plans are color-coded: green (modified \u003c7 days ago), yellow (7-30 days), red (\u003e30 days)"},{"done":false,"text":"Arrow keys move selection between plans in the active pane"},{"done":false,"text":"Pressing Enter on a selected plan expands it inline to show full goal, AC summary, and last verification status"},{"done":false,"text":"Pressing `q` or `Esc` quits the dashboard and restores the terminal"},{"done":false,"text":"Pressing `r` refreshes all data from disk"},{"done":false,"text":"`osc dashboard --watch` automatically refreshes every 30 seconds (configurable with `--interval \u003cseconds\u003e`)"},{"done":false,"text":"`osc status --dashboard` is an alias for `osc dashboard`"},{"done":false,"text":"Dashboard gracefully handles empty scaffold (zero plans): shows \"No active plans. Create one with `osc plan new \u003cslug\u003e --stage active`\""},{"done":false,"text":"Dashboard shows verify status indicator: green if `./verify.sh --standard` passes, yellow if warnings only, red if failures"},{"done":false,"text":"Dashboard works in terminals as small as 80x24 — content is scrollable if it exceeds viewport"},{"done":false,"text":"All existing tests pass; new dashboard tests cover data fetching and state formatting"}],"openQuestions":["Which TUI library? `ink` uses React, which is heavy for a CLI tool but provides excellent component model. `blessed` is more traditional and lighter. A zero-dependency implementation with raw ANSI codes is the most portable but most labor-intensive. Recommendation: use `ink` — it's the modern standard for Node.js TUI apps (used by Stripe, Shopify, Vercel CLIs) and its React model makes the dashboard composable. Accept the dependency weight.","Should `osc dashboard` replace `osc status` over time? Not initially — `osc status` is quick, scriptable, and JSON-output-capable. The dashboard is for human consumption. Both should coexist.","Should the dashboard show `osc task` data when task DB exists? Yes — add a task summary pane (counts by status) when `.osc/tasks.db` is detected. This makes the dashboard a unified cockpit."]},{"slug":"067-plan-dependency-graph","path":".osc/plans/backlog/067-plan-dependency-graph.md","stage":"backlog","status":"backlog","goal":"Ship `osc plan graph [--format ascii|mermaid|json]` that reads plan cross-references and renders a dependency DAG showing which plans depend on which, which are blocking others, and the critical path.","criteria":[{"done":false,"text":"`osc plan graph` prints an ASCII tree showing all plans in active/ and backlog/ with their declared dependencies as indented children"},{"done":false,"text":"`osc plan graph --format mermaid` outputs a valid Mermaid flowchart that can be pasted into GitHub markdown and renders correctly"},{"done":false,"text":"`osc plan graph --format json` outputs a JSON DAG with nodes (plan slug, stage, goal summary) and edges (from, to, relationship type: depends_on|blocks|follows)"},{"done":false,"text":"Dependency patterns detected: `depends on: \u003cslug\u003e`, `blocks: \u003cslug\u003e`, `follows: \u003cslug\u003e`, `--plan \u003cslug\u003e`, `see plan \u003cslug\u003e`, `blocked by: \u003cslug\u003e`, `inherits from: \u003cslug\u003e`"},{"done":false,"text":"`--stage active` filters to only active plans and their dependencies"},{"done":false,"text":"`--stage all` includes all stages (active, backlog, blocked, done)"},{"done":false,"text":"`--direction downstream` shows only what this plan depends on"},{"done":false,"text":"`--direction upstream` shows only what depends on this plan (reverse dependency — \"what's blocked on this?\")"},{"done":false,"text":"`--direction both` (default) shows the full neighborhood"},{"done":false,"text":"Warnings printed to stderr for: unresolved dependencies (target plan not found), circular dependencies detected"},{"done":false,"text":"Plans with zero declared dependencies show as standalone nodes (not an error)"},{"done":false,"text":"Exit code 0 even with warnings (warnings are informational, not blocking)"},{"done":false,"text":"All existing tests pass; new graph tests cover dependency extraction and rendering"}],"openQuestions":["Should `osc plan graph` also read dependency data from a machine-readable field in the plan YAML frontmatter (if we add frontmatter support)? This would be more reliable than regex parsing. Decision: regex parsing for v1 (works with existing plans). If frontmatter is added in a future plan, add a `dependencies:` field that the graph command reads preferentially.","Should the graph show done plans by default? No — done plans clutter the graph. But `--stage all` includes them for historical context.","Should `osc plan graph --critical-path` compute the longest dependency chain (critical path for project completion)? This is a natural analytics feature. Defer to v2 — requires proper DAG topological sort, which is straightforward but adds scope."]},{"slug":"068-python-reference-parser","path":".osc/plans/backlog/068-python-reference-parser.md","stage":"backlog","status":"backlog","goal":"Ship a single-file Python reference parser (`open_scaffold/parser.py`) that reads plan files, extracts sections and acceptance criteria, and exposes scaffold state — matching the TypeScript implementation's semantics — with zero dependencies beyond Python 3.10+ stdlib.","criteria":[{"done":false,"text":"`open_scaffold/parser.py` contains a `parse_plan(path: str) -\u003e dict` function that returns: slug, status, goal, sections (dict of heading → content), files_to_touch (list), acceptance_criteria (list), verification_steps (list), open_questions (list), execution_strategy (optional dict with groups/dependencies/delegation_notes)"},{"done":false,"text":"`open_scaffold/parser.py` contains an `inspect_scaffold(root: str \u003d \".\") -\u003e dict` function that returns: root, namespace, mission (defined, reason), plans (dict of stage → list of {slug, path})"},{"done":false,"text":"Output of `parse_plan()` matches the TypeScript `parsePlanFile()` output for the same plan file (verified by comparing JSON outputs)"},{"done":false,"text":"Output of `inspect_scaffold()` matches the TypeScript `inspectScaffold()` output for the same repo"},{"done":false,"text":"`python -m open_scaffold status` prints plan counts by stage (matching `osc status` text output shape)"},{"done":false,"text":"`python -m open_scaffold plan .osc/plans/backlog/050-npm-publish-and-npx-init.md` prints parsed plan as JSON"},{"done":false,"text":"`python -m open_scaffold verify` runs mission-defined and plan-presence checks (matching `osc verify --quick` semantics)"},{"done":false,"text":"The parser correctly handles: plans with amendments in the same folder (ignores amendment files when listing plans), plans in root `.osc/plans/` (not in a stage folder), plans with empty sections, plans with `## Status` mismatch (reports actual folder location vs declared status)"},{"done":false,"text":"All parser tests pass with `python -m pytest python/tests/` (or `python -m unittest` if no pytest dependency)"},{"done":false,"text":"`python/README.md` includes: 3-line vendoring example (copy parser.py, import, use), pip install instructions, parity table showing TypeScript function → Python function mapping"},{"done":false,"text":"`npm test` and `./verify.sh --standard` pass (Python files are additive, no impact on Node.js code)"}],"openQuestions":["Should the Python parser be a separate PyPI package (`pip install open-scaffold-parser`) or only vendorable? Vendoring-first: the single-file copy approach supports the widest range of use cases (air-gapped, no pip, embedded in larger projects). PyPI publication can follow as a convenience.","Should the Python parser support plan creation/amendment in v1? No — read-only parsing is the 80/20 use case. Python-based plan mutation would require reimplementing amend.sh logic (autonumbering, changelog stamping), which is significantly more code.","Should there be parity tests that run both TypeScript and Python parsers on the same plan files and diff the output? Yes — this is the gold standard for reference implementation correctness. Add a CI step or test script that generates JSON from both parsers and asserts structural equivalence."]},{"slug":"069-v1-launch","path":".osc/plans/backlog/069-v1-launch.md","stage":"backlog","status":"backlog","goal":"Ship Open Scaffold v1.0.0: npm published, README crisp, documentation compressed, at least 3 downstream use cases cited, website or landing page live, and a clear public statement of what is stable (the protocol and CLI) versus what is experimental (runtime adapters, MCP, glass cockpit).","criteria":[{"done":false,"text":"`npm view open-scaffold version` returns `1.0.0`"},{"done":false,"text":"`npx open-scaffold@1.0.0 init --tier min --target /tmp/test-v1` succeeds and creates a valid scaffold"},{"done":false,"text":"`npx open-scaffold@1.0.0 init --tier standard --target /tmp/test-v1-std` succeeds with all standard files"},{"done":false,"text":"`README.md` contains a \"Stability\" section that lists: stable (CLI commands plan/new/amend/close/evidence/verify/status, plan schema, folder state machine, verify.sh), experimental (runtime profiles, MCP, glass cockpit webhooks, task database, TUI dashboard), and future (native spawning, compliance certification, model benchmarking)"},{"done":false,"text":"`docs/STABILITY.md` exists with detailed semver guarantees and migration guidance for future breaking changes"},{"done":false,"text":"`docs/CHANGELOG.md` exists with curated, human-readable changelog grouped by version (v0.1 through v1.0.0)"},{"done":false,"text":"At least one public landing page or presentation exists: either `docs/index.html`, a GitHub Pages site, or a dedicated website page explaining what Open Scaffold is, who it's for, and how to start"},{"done":false,"text":"The landing page answers in 30 seconds: what problem does this solve, who is it for, what's the first command to run"},{"done":false,"text":"`ROADMAP.md` shows v1.0.0 as a completed milestone with links to release evidence and key PRs"},{"done":false,"text":"`MISSION.md` changelog has a v1.0.0 entry summarizing the launch"},{"done":false,"text":"`AGENTS.md` and `CLAUDE.md` paired views are in sync for v1.0.0"},{"done":false,"text":"`./verify.sh --strict` passes"},{"done":false,"text":"`npm test` passes"},{"done":false,"text":"`npm run build` succeeds"},{"done":false,"text":"GitHub Release exists at https:\/\/github.com/graphanov/open-scaffold/releases/tag/v1.0.0 with release notes citing key milestones and the identity chain"}],"openQuestions":["Should v1.0.0 coincide with a formal launch post (blog, social media, Hacker News, Reddit)? This is a marketing decision for the owner. The plan should prepare the technical artifacts; the owner decides when and where to announce.","Should there be a v1.0.0 video demo or only text/image? A video demo would dramatically improve first-impression conversion. If the owner is willing, a 2-minute screen recording of `npx open-scaffold init` → create plan → verify → evidence → close would be the single most effective adoption artifact.","Should the landing page use `graphanov.com/open-scaffold` or a separate domain? The owner's current strategy routes Open Scaffold as proof through graphanov.com. Use `graphanov.com/open-scaffold` as the canonical URL, with a GitHub Pages fallback at `graphanov.github.io/open-scaffold`.","What v0.x features should be declared experimental vs stable for v1.0.0? The guiding principle: if it has automated tests and has been used in the self-dogfood loop, it's stable. CLI commands with test coverage (plan, amend, close, evidence, verify, status, init) \u003d stable. CLI commands without full E2E test coverage (run, review, ultrareview, eval, audit, runtimes, doctor, delegate) \u003d experimental. Shell scripts \u003d stable (they're the zero-dep floor)."]},{"slug":"070-runtime-adapter-registry","path":".osc/plans/backlog/070-runtime-adapter-registry.md","stage":"backlog","status":"backlog","goal":"Ship a runtime adapter registry: a JSON file in the Open Scaffold repo listing known adapter packages, plus `osc runtimes search|install|info` commands to discover and set up adapters, establishing the marketplace pattern without building a marketplace backend.","criteria":[{"done":false,"text":"`registry.json` exists with a `$schema` field, a `version` field, and an `adapters` array"},{"done":false,"text":"`registry.json` includes at minimum: the built-in OMX adapter (`packages/runtime-omx/`), plus documentation for how to submit new entries"},{"done":false,"text":"Each adapter entry has: `id` (unique slug), `name` (human-readable), `description`, `repo` (URL), `install` (command or object with platform variants), `workflows` (list of supported workflow names), `runtime` (omc|omx|plain-agent|human|custom), `minOpenScaffoldVersion`, `conformance` (self-declared conformance level and date), `status` (stable|beta|experimental)"},{"done":false,"text":"`osc runtimes search \"omx\"` returns entries matching the query in name, description, or id"},{"done":false,"text":"`osc runtimes search` (no query) lists all registry entries"},{"done":false,"text":"`osc runtimes info omx` displays the full entry for the OMX adapter: name, description, repo, install command, supported workflows, conformance status"},{"done":false,"text":"`osc runtimes install omx` prints the install command (e.g., `cd packages/runtime-omx \u0026\u0026 npm install \u0026\u0026 npm run build`) and asks for confirmation before executing"},{"done":false,"text":"`osc runtimes install omx --yes` skips confirmation and runs the install command"},{"done":false,"text":"`osc runtimes registry` shows registry metadata: number of adapters, last updated, schema version"},{"done":false,"text":"The `registry.json` schema is documented in `docs/ADAPTER_REGISTRY.md` with a JSON Schema definition"},{"done":false,"text":"`docs/ADAPTER_REGISTRY.md` includes submission instructions: fork, add entry, open PR, what the maintainer checks before merge"},{"done":false,"text":"All existing tests pass; new registry tests cover search, info display, and install command generation"}],"openQuestions":["Should the registry support version ranges (e.g., adapter v1.2.0 requires Open Scaffold \u003e\u003d1.0.0)? Yes — `minOpenScaffoldVersion` is a simple floor. Semantic version range support (e.g., `^1.0.0`) would be more precise but adds complexity. Start with minimum version only.","Should `osc runtimes install` ever install packages globally (npm install -g)? No — adapters should be project-local (npm install in the repo or in a packages/ directory). Global installs create version conflicts across projects.","Should the registry be automatically tested in CI? A CI step that validates `registry.json` schema and checks that all listed repos are accessible (HTTP 200) would catch stale entries. Add this as a stretch goal if the registry grows beyond 10 entries.","Should the registry be in the core repo or a separate `open-scaffold-registry` repo? In the core repo for v1 — it's a single file and the submission flow (PR to core) is simple. A separate repo would be warranted if the registry grows to 50+ entries with automated validation."]},{"slug":"071-evidence-chain-verifier","path":".osc/plans/backlog/071-evidence-chain-verifier.md","stage":"backlog","status":"backlog","goal":"Ship `osc verify --evidence-chain` that walks the full identity chain for a plan or the entire project, verifying that every acceptance criterion has evidence, every run reference is valid, every evidence note links back to a plan, and the close decision has a rationale.","criteria":[{"done":false,"text":"`osc verify --evidence-chain` walks all done plans in the project and reports: total plans checked, total evidence links found, intact/broken/missing/unverifiable counts, and a per-plan breakdown"},{"done":false,"text":"`osc verify --evidence-chain --plan 050-npm-publish` verifies the chain for a single plan: plan exists → acceptance criteria have evidence references → evidence note exists → evidence note links back to plan → close decision has rationale"},{"done":false,"text":"For each done plan, the verifier checks: (1) plan file exists in `done/`, (2) plan has acceptance criteria, (3) each AC checkbox is marked `[x]` with an evidence reference (or explicitly marked `N/A`), (4) if plan references a run ID, `.osc/runs/\u003crun_id\u003e/` exists, (5) if plan references a PR, the PR reference is syntactically valid (URL or `#NN`), (6) if an evidence note exists for the plan, it cites the plan slug, (7) the close decision in the evidence note or plan is one of: approved, weak_approved, rejected, blocked"},{"done":false,"text":"`--json` outputs a JSON array of findings with: plan_slug, links (array of {type, reference, status, detail})"},{"done":false,"text":"`--strict` mode: exit code 1 if any link is `broken` or `missing` (not just `unverifiable`)"},{"done":false,"text":"Default mode: exit code 1 only for `broken` links; `missing` and `unverifiable` produce warnings but exit 0"},{"done":false,"text":"Verifier handles plans with no evidence (reports \"no evidence links found\" for that plan, not an error)"},{"done":false,"text":"Verifier handles plans with no run ID (skips run packet check, reports \"no run reference\" as informational)"},{"done":false,"text":"All existing tests pass; new chain verifier tests cover all link statuses"}],"openQuestions":["Should `osc verify --evidence-chain` also validate that evidence notes aren't stale (e.g., saying \"pending\" while citing a merged PR)? This is partially covered by `verify.sh --strict` Check 9 (release note stale-state detection). The chain verifier could deepen this: check that the evidence note's Outcome section doesn't contradict its Traceability section. Defer to a follow-up — keep v1 focused on chain integrity.","Should the chain verifier be integrated into `verify.sh` as a new tier (`--evidence-chain`) or stay as a separate `osc` command? Stay as `osc verify --evidence-chain` — the shell script is already long and complex. The chain verifier requires plan parsing logic that's impractical in bash.","Should links to GitHub PRs and issues be verified via API? This would require network access and a GitHub token, violating the local-only constraint. The `unverifiable` status is the correct handling — it tells the user \"this link exists but I can't check it from here.\""]},{"slug":"072-cross-platform-workflow-docs","path":".osc/plans/backlog/072-cross-platform-workflow-docs.md","stage":"backlog","status":"backlog","goal":"Ship cross-platform workflow documentation covering GitLab, Bitbucket, and Gitea, mapping the GitHub identity chain to each platform's equivalent primitives (Issues → merge requests → CI → releases), with platform-specific command examples.","criteria":[{"done":false,"text":"`docs/GITLAB_WORKFLOW.md` exists with: platform overview, identity chain mapping (GitHub Issue → GitLab Issue, PR → Merge Request, Codex review → GitLab CI review job, GitHub Release → GitLab Release), `glab` CLI examples for issue creation, MR creation, and CI status checking, MR template with scaffold traceability fields"},{"done":false,"text":"`docs/BITBUCKET_WORKFLOW.md` exists with: platform overview, identity chain mapping (GitHub Issue → Bitbucket Issue, PR → Pull Request, Codex review → Pipeline review step, GitHub Release → Bitbucket Download/Release), `curl`/API examples for issue and PR management (Bitbucket has no official CLI), PR template"},{"done":false,"text":"`docs/GITEA_WORKFLOW.md` exists with: platform overview, identity chain mapping (GitHub Issue → Gitea Issue, PR → Pull Request, Codex review → Gitea Actions review job, GitHub Release → Gitea Release), `tea` CLI examples"},{"done":false,"text":"Each platform doc follows the same structure: (1) Platform overview, (2) Identity chain mapping table, (3) Setup: creating the first issue from a roadmap item, (4) Branching and PR/MR workflow, (5) CI integration, (6) Release and evidence, (7) Platform-specific limitations (e.g., no Codex connector, different CI syntax)"},{"done":false,"text":"Each platform doc includes a copy-pasteable PR/MR template body with scaffold traceability fields (plan slug, run ID, task ID, verification, evidence path)"},{"done":false,"text":"`docs/GITHUB_WORKFLOW.md` has a prominent \"Other Platforms\" section at the top linking to the three new docs"},{"done":false,"text":"`docs/OPEN_SCAFFOLD_SYSTEM.md` section 7 (\"GitHub/public versioning layer\") is renamed to \"Public versioning layer\" and states that the protocol works with any git forge, with GitHub as the documented reference implementation"},{"done":false,"text":"All docs use neutral language: \"merge request\" for GitLab, \"pull request\" for Bitbucket/Gitea, not assuming GitHub terminology"},{"done":false,"text":"`./verify.sh --standard` passes (new docs are additive, no plan/schema violations)"}],"openQuestions":["Should the scaffold generate platform-specific CI templates (`.gitlab-ci.yml`, `bitbucket-pipelines.yml`) like it does `.github/workflows/`? Defer to a follow-up plan — the docs are the first step. CI templates require testing on each platform, which is significantly more effort.","Azure DevOps support? Deferred — Azure DevOps has a different enough model (work items, boards, pipelines as separate products) that a proper mapping requires more research. Add if there's demand.","Should the platform docs be in a `docs/platforms/` subdirectory? Yes — as the number of platform docs grows, they should be grouped. Do this as part of this plan: `docs/platforms/github.md` (move and rename existing), `docs/platforms/gitlab.md`, `docs/platforms/bitbucket.md`, `docs/platforms/gitea.md`, with `docs/GITHUB_WORKFLOW.md` becoming a redirect/symlink for backward compatibility."]},{"slug":"073-glass-cockpit-event-persistence","path":".osc/plans/backlog/073-glass-cockpit-event-persistence.md","stage":"backlog","status":"backlog","goal":"Add `osc cockpit log` — an append-only JSON Lines event log at `.osc/cockpit.log` that persists every cockpit event with timestamp, event type, content, and correlation IDs — and `osc cockpit history` to query and replay the log.","criteria":[{"done":false,"text":"`osc cockpit log-event --event status --message \"Sprint review started\" --plan 050-npm-publish` appends a JSON line to `.osc/cockpit.log` with: timestamp (ISO 8601), event_type, message, plan_slug, and an auto-generated event_id (UUID or timestamp-nanoid)"},{"done":false,"text":"`osc cockpit post --event completion_report --message \"...\" --plan 050-npm-publish` (plan 062) automatically writes the same event to the log after posting to webhooks (no double command needed)"},{"done":false,"text":"`osc cockpit post --dry-run` does NOT write to the log (dry-run means no side effects)"},{"done":false,"text":"`.osc/cockpit.log` is valid JSON Lines: every line is a parseable JSON object, no trailing commas, no multi-line objects"},{"done":false,"text":"`osc cockpit history` displays recent events in reverse chronological order (newest first) with timestamp, event type, and message summary"},{"done":false,"text":"`osc cockpit history --since 2026-05-01 --until 2026-05-18` filters by time range"},{"done":false,"text":"`osc cockpit history --event blocker` filters to only blocker events"},{"done":false,"text":"`osc cockpit history --plan 050-npm-publish` filters to events correlated with that plan"},{"done":false,"text":"`osc cockpit history --search \"deploy\"` full-text searches event messages"},{"done":false,"text":"`osc cockpit history --limit 10` returns at most 10 events"},{"done":false,"text":"`osc cockpit history --json` outputs machine-parseable JSON array"},{"done":false,"text":"`osc cockpit stats` prints: total events, events by type (count per event_type), events by plan (count per plan), date range (first event to last event), most recent event timestamp"},{"done":false,"text":"When `.osc/cockpit.log` does not exist, all commands gracefully report \"No cockpit events logged yet\" (exit 0)"},{"done":false,"text":"Events logged include all correlation IDs from the post command: task_id, run_id, plan_slug, pr_url, evidence_path"},{"done":false,"text":"All existing tests pass; new cockpit log tests cover writing, reading, filtering, querying, and empty-state handling"}],"openQuestions":["Should cockpit events be automatically logged during `osc close` and `osc evidence new` lifecycle commands? Plan 062 left this as an open question. This plan should answer it: yes, lifecycle commands should emit cockpit events that are both posted (if webhooks are configured) and logged. The event types map naturally: `osc close` → `completion_report`, `osc evidence new` → `evidence_receipt`, `osc amend` → `status` (scope change). Implementation should be in the lifecycle commands themselves, not the cockpit module — each command calls `cockpit.emit(event)` after its main operation succeeds.","Should `.osc/cockpit.log` be human-readable in a text editor? JSON Lines is semi-human-readable (one JSON object per line). It's not pretty-printed but `jq` can format it. This is the right trade-off: machine-parseable and append-efficient, with human readability via tooling.","Should the log support structured event schemas beyond the current flat JSON? Each event type could have a specific schema (e.g., `completion_report` must include `verification_status`, `approval_decision`). Defer to v2 — v1 uses a common base schema for all events with optional type-specific fields. This keeps the implementation simple while allowing richer data on a per-event basis."]}],"blocked":[],"done":[{"slug":"001-generic-osc-core-amendment-1","path":".osc/plans/done/001-generic-osc-core-amendment-1.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"001-generic-osc-core-amendment-2","path":".osc/plans/done/001-generic-osc-core-amendment-2.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"001-generic-osc-core-amendment-3","path":".osc/plans/done/001-generic-osc-core-amendment-3.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"001-generic-osc-core-amendment-4","path":".osc/plans/done/001-generic-osc-core-amendment-4.md","stage":"done","status":"done","goal":"","criteria":[],"openQuestions":[]},{"slug":"001-generic-osc-core","path":".osc/plans/done/001-generic-osc-core.md","stage":"done","status":"active","goal":"Rewrite open-scaffold into a generic `.osc`-based scaffold with an `osc` CLI that parses scaffo
